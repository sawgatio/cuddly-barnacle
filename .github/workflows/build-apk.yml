name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set Executable Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy and Rename APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/TacticalStrike-v1.0.0.apk
          ls -la release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalStrike-v1.0.0-APK
          path: release-output/TacticalStrike-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Tactical Strike v1.0.0 - Android APK"
          body: |
            ### 🎮 Tactical Strike Android APK (v1.0.0)

            Direct standalone `.apk` download for Android devices!

            #### ✨ What's Included:
            - **Original 3D Tactical FPS Gameplay**: High-speed arena combat, tactical walk, crouch, jump, and recoil gunplay.
            - **Mobile Touch Controls**: Left virtual joystick for movement, right screen touch swipe for look/aim, and dedicated action buttons.
            - **Real-Time P2P Multiplayer**: Built-in room code system (`STRIKE-XXX`) — host or join matches instantly with friends over Wi-Fi/4G.
            - **Zero Heavy Software Needed**: Completely self-contained native APK.

            #### 📲 Installation Instructions:
            1. Download `TacticalStrike-v1.0.0.apk` below to your Android device.
            2. Tap the file to install (allow *"Install from unknown sources"* if prompted).
            3. Open the game, tap **Multiplayer**, share your room code with your friend, and jump into the arena!
          files: release-output/TacticalStrike-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
